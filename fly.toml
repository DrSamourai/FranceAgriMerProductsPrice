# fly.toml app configuration file for ToqueHub RNM

app = "toquehub-rnm"
primary_region = "cdg" # Paris region (best response time for FranceAgriMer)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
